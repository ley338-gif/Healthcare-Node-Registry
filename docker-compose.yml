name: healthcare-node-registry

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    ports:
      - "${DIAGNOSTIC_STORAGE_COMMITMENT_HOST_PORT:-11113}:${DIAGNOSTIC_STORAGE_COMMITMENT_CALLBACK_PORT:-11113}"
    env_file: .env
    volumes:
      - ./:/var/www/html
      - app_storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    networks:
      - frontend
      - backend
    security_opt:
      - no-new-privileges:true

  worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "database", "--queue=discovery,default", "--sleep=1", "--tries=1", "--max-time=3600"]
    env_file: .env
    volumes:
      - ./:/var/www/html
      - app_storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    networks:
      - frontend
      - backend
    security_opt:
      - no-new-privileges:true

  web:
    image: nginx:1.28.0-alpine3.21
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - app_storage:/var/www/html/storage:ro
    depends_on:
      - app
    networks:
      - frontend
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run

  db:
    image: postgres:18.4-bookworm
    restart: unless-stopped
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true

  app-test:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    profiles: ["test"]
    environment:
      APP_NAME: Healthcare Node Registry Tests
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_DEBUG: "false"
      APP_URL: http://localhost
      LOG_CHANNEL: stderr
      LOG_LEVEL: warning
      DB_CONNECTION: pgsql
      DB_HOST: db-test
      DB_PORT: "5432"
      DB_DATABASE: healthcare_node_registry_test
      DB_USERNAME: registry_test
      DB_PASSWORD: registry-test-only
      DB_SSLMODE: prefer
      SESSION_DRIVER: array
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      FILESYSTEM_DISK: local
      BCRYPT_ROUNDS: "4"
    volumes:
      - ./:/var/www/html
      - app_test_storage:/var/www/html/storage
    depends_on:
      db-test:
        condition: service_healthy
    networks:
      - test_backend
    security_opt:
      - no-new-privileges:true

  db-test:
    image: postgres:18.4-bookworm
    profiles: ["test"]
    environment:
      POSTGRES_DB: healthcare_node_registry_test
      POSTGRES_USER: registry_test
      POSTGRES_PASSWORD: registry-test-only
    volumes:
      - postgres_test_data:/var/lib/postgresql
    networks:
      - test_backend
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U registry_test -d healthcare_node_registry_test",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    security_opt:
      - no-new-privileges:true

  node:
    image: node:24.18.0-bookworm-slim
    working_dir: /app
    user: node
    volumes:
      - ./:/app
    profiles: ["tools"]
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]

volumes:
  postgres_data:
  postgres_test_data:
  app_storage:
  app_test_storage:

networks:
  frontend:
  backend:
    internal: true
  test_backend:
    internal: true
