name: healthcare-node-registry

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "${DOCKER_LOG_MAX_SIZE:-10m}"
    max-file: "${DOCKER_LOG_MAX_FILES:-5}"

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: development
    restart: unless-stopped
    ports:
      - "${DIAGNOSTIC_STORAGE_COMMITMENT_BIND_ADDRESS:-0.0.0.0}:${DIAGNOSTIC_STORAGE_COMMITMENT_HOST_PORT:-11113}:${DIAGNOSTIC_STORAGE_COMMITMENT_CALLBACK_PORT:-11113}"
    logging: *default-logging
    env_file: .env
    volumes:
      - ./:/var/www/html
      - app_storage:/var/www/html/storage
      - ${DIAGNOSTIC_TLS_PROFILE_HOST_DIRECTORY:-./docker/dicom-tls}:${DIAGNOSTIC_TLS_PROFILE_DIRECTORY:-/run/secrets/dicom-tls}:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - frontend
      - backend
    security_opt:
      - no-new-privileges:true

  worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: development
    restart: unless-stopped
    logging: *default-logging
    command: ["php", "artisan", "queue:work", "database", "--queue=discovery,default", "--sleep=1", "--tries=1", "--max-time=3600"]
    env_file: .env
    volumes:
      - ./:/var/www/html
      - app_storage:/var/www/html/storage
      - ${DIAGNOSTIC_TLS_PROFILE_HOST_DIRECTORY:-./docker/dicom-tls}:${DIAGNOSTIC_TLS_PROFILE_DIRECTORY:-/run/secrets/dicom-tls}:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - frontend
      - backend
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "php", "artisan", "registry:worker-health", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: development
    restart: unless-stopped
    logging: *default-logging
    command: ["php", "artisan", "schedule:work"]
    env_file: .env
    volumes:
      - ./:/var/www/html
      - app_storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    networks:
      - frontend
      - backend
    security_opt:
      - no-new-privileges:true

  web:
    image: nginx:1.30.4-alpine3.24@sha256:97d490c12ba55b4946b01546d1c3ed324e8d41ab1c9fcb2a616aa470620e5b46
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "8080:8080"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - app_storage:/var/www/html/storage:ro
    depends_on:
      - app
    networks:
      - frontend
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run

  db:
    image: "healthcare-node-registry-postgres:${HNR_IMAGE_TAG:-0.9.0-rc.2}"
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
      args:
        APP_VERSION: "${HNR_VERSION:-0.9.0-rc.2}"
        VCS_REF: "${HNR_REVISION:-unknown}"
    restart: unless-stopped
    logging: *default-logging
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true

  clamav:
    image: clamav/clamav:1.5.4@sha256:638d90201ee7ee6a82d249a2fc23b132e578673b5f1f2766852b127676ca1ef6
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - clamav_data:/var/lib/clamav
    networks:
      - backend
      - clamav_updates
    healthcheck:
      test: ["CMD", "/usr/local/bin/clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 6m
    security_opt:
      - no-new-privileges:true

  app-test:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: development
    profiles: ["test"]
    logging: *default-logging
    environment:
      APP_NAME: Healthcare Node Registry Tests
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_DEBUG: "false"
      APP_URL: http://localhost
      LOG_CHANNEL: stderr
      LOG_LEVEL: warning
      DB_CONNECTION: pgsql
      DB_HOST: db-test
      DB_PORT: "5432"
      DB_DATABASE: healthcare_node_registry_test
      DB_USERNAME: registry_test
      DB_PASSWORD: registry-test-only
      DB_SSLMODE: prefer
      SESSION_DRIVER: array
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      FILESYSTEM_DISK: local
      BCRYPT_ROUNDS: "4"
    volumes:
      - ./:/var/www/html
      - app_test_storage:/var/www/html/storage
    depends_on:
      db-test:
        condition: service_healthy
    networks:
      - test_backend
    security_opt:
      - no-new-privileges:true

  db-test:
    image: postgres:18.6-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
    profiles: ["test"]
    logging: *default-logging
    environment:
      POSTGRES_DB: healthcare_node_registry_test
      POSTGRES_USER: registry_test
      POSTGRES_PASSWORD: registry-test-only
    volumes:
      - postgres_test_data:/var/lib/postgresql
    networks:
      - test_backend
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U registry_test -d healthcare_node_registry_test",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    security_opt:
      - no-new-privileges:true

  node:
    image: node:24.18.0-bookworm-slim@sha256:6f7b03f7c2c8e2e784dcf9295400527b9b1270fd37b7e9a7285cf83b6951452d
    working_dir: /app
    user: node
    volumes:
      - ./:/app
    profiles: ["tools"]
    logging: *default-logging
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]

volumes:
  postgres_data:
  postgres_test_data:
  app_storage:
  app_test_storage:
  clamav_data:

networks:
  frontend:
  backend:
    internal: true
  test_backend:
    internal: true
  clamav_updates:
