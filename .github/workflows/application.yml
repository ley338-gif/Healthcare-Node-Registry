name: Application checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repository:
  runs-on: ubuntu-latest
  steps:
    - uses: actions/checkout@v4

    - name: Reject committed runtime configuration
      shell: bash
      run: |
        set -euo pipefail

        if git ls-files --error-unmatch .env >/dev/null 2>&1; then
          echo ".env must not be committed."
          exit 1
        fi

    - name: Prepare CI environment file
      shell: bash
      run: cp .env.example .env

    - name: Validate Docker Compose
      run: docker compose config --quiet

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4-bookworm
        env:
          POSTGRES_DB: healthcare_node_registry_test
          POSTGRES_USER: registry
          POSTGRES_PASSWORD: registry-development-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U registry -d healthcare_node_registry_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: healthcare_node_registry_test
      DB_USERNAME: registry
      DB_PASSWORD: registry-development-only
      SESSION_DRIVER: array
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: intl, pdo_pgsql, zip
          coverage: none
          tools: composer:v2
      - run: composer validate --strict --no-check-publish
      - run: composer install --no-interaction --prefer-dist
      - run: composer audit --locked --no-interaction
      - run: composer quality
      - run: php artisan migrate:fresh --force
      - run: php artisan registry:doctor --skip-assets

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high --omit=dev
      - run: npm run check

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/php/Dockerfile
          push: false
          tags: healthcare-node-registry:ci
