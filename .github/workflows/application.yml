name: Application checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reject committed runtime configuration
        shell: bash
        run: |
          set -euo pipefail

          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo ".env must not be committed."
            exit 1
          fi

      - name: Prepare CI environment file
        shell: bash
        run: cp .env.example .env

      - name: Validate Docker Compose
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.https.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.release.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.release.yml -f docker-compose.https.yml config --quiet

      - name: Validate HTTPS Nginx configuration
        shell: bash
        run: |
          set -euo pipefail

          certificate_directory="$(mktemp -d)"
          trap 'rm -rf "$certificate_directory"' EXIT
          openssl req -x509 -newkey rsa:2048 -sha256 -nodes \
            -keyout "$certificate_directory/tls.key" \
            -out "$certificate_directory/tls.crt" \
            -days 1 \
            -subj "/CN=localhost"
          docker run --rm \
            --add-host app:127.0.0.1 \
            --mount "type=bind,source=$PWD/docker/nginx/https.conf,target=/etc/nginx/conf.d/default.conf,readonly" \
            --mount "type=bind,source=$certificate_directory,target=/run/secrets/https,readonly" \
            nginx:1.30.4-alpine3.24@sha256:97d490c12ba55b4946b01546d1c3ed324e8d41ab1c9fcb2a616aa470620e5b46 nginx -t

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4-bookworm
        env:
          POSTGRES_DB: healthcare_node_registry_test
          POSTGRES_USER: registry
          POSTGRES_PASSWORD: registry-development-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U registry -d healthcare_node_registry_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: healthcare_node_registry_test
      DB_USERNAME: registry
      DB_PASSWORD: registry-development-only
      SESSION_DRIVER: array
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      DIAGNOSTIC_PYTHON_BINARY: ${{ github.workspace }}/.venv-dicom/bin/python
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: intl, pdo_pgsql, zip, pcov
          coverage: pcov
          tools: composer:v2
      - name: Install DICOM test tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes dcmtk python3-venv
          python3 -m venv .venv-dicom
          .venv-dicom/bin/pip install --no-cache-dir --require-hashes -r docker/php/requirements-dicom.txt
      - run: composer validate --strict --no-check-publish
      - run: composer install --no-interaction --prefer-dist
      - run: composer audit --locked --no-interaction
      - run: composer ci
      - run: php artisan migrate:fresh --force
      - run: php artisan registry:doctor --skip-assets --skip-admin

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high --omit=dev
      - run: npm run check

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/php/Dockerfile
          target: release-app
          push: false
          tags: healthcare-node-registry:ci
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/php/Dockerfile
          target: release-web
          push: false
          tags: healthcare-node-registry-web:ci
