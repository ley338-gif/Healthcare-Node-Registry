name: Application checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Reject committed runtime configuration
        shell: bash
        run: |
          set -euo pipefail

          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo ".env must not be committed."
            exit 1
          fi

      - name: Prepare CI environment file
        shell: bash
        run: cp .env.example .env

      - name: Validate Docker Compose
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.https.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.release.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.release.yml -f docker-compose.https.yml config --quiet

      - name: Validate HTTPS Nginx configuration
        shell: bash
        run: |
          set -euo pipefail

          certificate_directory="$(mktemp -d)"
          trap 'rm -rf "$certificate_directory"' EXIT
          openssl req -x509 -newkey rsa:2048 -sha256 -nodes \
            -keyout "$certificate_directory/tls.key" \
            -out "$certificate_directory/tls.crt" \
            -days 1 \
            -subj "/CN=localhost"
          docker run --rm \
            --add-host app:127.0.0.1 \
            --mount "type=bind,source=$PWD/docker/nginx/https.conf,target=/etc/nginx/conf.d/default.conf,readonly" \
            --mount "type=bind,source=$certificate_directory,target=/run/secrets/https,readonly" \
            nginx:1.30.4-alpine3.24@sha256:97d490c12ba55b4946b01546d1c3ed324e8d41ab1c9fcb2a616aa470620e5b46 nginx -t

  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.6-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
        env:
          POSTGRES_DB: healthcare_node_registry_test
          POSTGRES_USER: registry
          POSTGRES_PASSWORD: registry-development-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U registry -d healthcare_node_registry_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: healthcare_node_registry_test
      DB_USERNAME: registry
      DB_PASSWORD: registry-development-only
      SESSION_DRIVER: array
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      DIAGNOSTIC_PYTHON_BINARY: ${{ github.workspace }}/.venv-dicom/bin/python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.4"
          extensions: intl, pdo_pgsql, zip, pcov
          coverage: pcov
          tools: composer:v2
      - name: Install DICOM test tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes dcmtk python3-venv
          python3 -m venv .venv-dicom
          .venv-dicom/bin/pip install --no-cache-dir --require-hashes -r docker/php/requirements-dicom.txt
      - run: composer validate --strict --no-check-publish
      - run: composer install --no-interaction --prefer-dist
      - run: composer ci
      - run: php artisan migrate:fresh --force
      - run: php artisan registry:doctor --skip-assets --skip-admin

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check

  container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate rootless database image
        shell: bash
        run: |
          set -euo pipefail
          docker build --pull --tag healthcare-node-registry-postgres:ci --file docker/postgres/Dockerfile .
          test "$(docker image inspect healthcare-node-registry-postgres:ci --format '{{.Config.User}}')" = "postgres"
          container_id="$(docker run --detach \
            --env POSTGRES_DB=registry_validation \
            --env POSTGRES_USER=registry_validation \
            --env POSTGRES_PASSWORD=synthetic-validation-only \
            healthcare-node-registry-postgres:ci)"
          trap 'docker rm --force "$container_id" >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if docker exec "$container_id" pg_isready -U registry_validation -d registry_validation; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs "$container_id"
              exit 1
            fi
            sleep 1
          done
          docker exec "$container_id" sh -c 'test ! -e /usr/local/bin/gosu'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/php/Dockerfile
          target: release-app
          push: false
          load: true
          tags: healthcare-node-registry:ci
      - name: Validate slim release application image
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --entrypoint sh healthcare-node-registry:ci -c '
            set -eu
            if php -m 2>&1 | grep -iE "warning|unable"; then exit 1; fi
            for module in intl pdo_pgsql zip pcntl "Zend OPcache"; do
              php -m | grep -qx "$module" || { echo "missing PHP module: $module"; exit 1; }
            done
            if php -m | grep -qx pcov; then echo "pcov must not be loaded"; exit 1; fi
            for library in "$(php-config --extension-dir)"/*.so; do
              if ldd "$library" | grep -q "not found"; then echo "unresolved library: $library"; exit 1; fi
            done
            for tool in gcc g++ make git composer curl unzip pip pip3; do
              if command -v "$tool" >/dev/null 2>&1; then echo "unexpected build tool: $tool"; exit 1; fi
            done
            if dpkg -s linux-libc-dev libc6-dev libssl-dev zlib1g-dev >/dev/null 2>&1; then
              echo "header packages must not be installed"; exit 1
            fi
            for tool in echoscu findscu storescu movescu getscu dcmdump storescp ping su; do
              command -v "$tool" >/dev/null || { echo "missing runtime tool: $tool"; exit 1; }
            done
            /opt/registry-dicom/bin/python -c "import pydicom, pynetdicom"
            storescp --aetitle HNR_CI 11200 & storescp_pid=$!
            sleep 1
            echoscu --call HNR_CI 127.0.0.1 11200
            kill "$storescp_pid"
            cd /var/www/html && php artisan --version
          '
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/php/Dockerfile
          target: release-web
          push: false
          tags: healthcare-node-registry-web:ci
