name: Documentation checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  markdown:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required files
        shell: bash
        run: |
          set -euo pipefail

          required=(
            README.md
            AI_ENGINEERING_MANUAL.md
            ROADMAP.md
            CHANGELOG.md
            SECURITY.md
            docs/Compliance/ISO27001.md
            docs/Compliance/ISO9001.md
          )

          for file in "${required[@]}"; do
            test -s "$file" || {
              echo "Missing or empty: $file"
              exit 1
            }
          done

      - name: Reject obvious secrets and patient identifiers
        shell: bash
        run: |
          set -euo pipefail

          if grep -RInE \
            --exclude-dir=.git \
            --exclude=documentation.yml \
            '(BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|password[[:space:]]*=[[:space:]]*[^<]|patientenname|geburtsdatum[[:space:]]*:[[:space:]]*[0-9]{2}\.[0-9]{2}\.[0-9]{4})' .; then
            echo "Potential secret or patient data detected. Review required."
            exit 1
          fi