name: Supply-chain security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  secrets:
    name: Secret history
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan repository history
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependencies:
    name: Dependency advisories
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.4"
          coverage: none
          tools: composer:v2
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Audit Composer lock file
        run: composer audit --locked --no-interaction
      - name: Audit production npm packages
        if: ${{ !cancelled() }}
        run: npm audit --omit=dev --audit-level=high --package-lock-only

  release-images:
    name: Release images and SBOM
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build release images
        shell: bash
        run: |
          set -euo pipefail
          docker build --pull \
            --target release-app \
            --build-arg "APP_VERSION=0.9.0-rc.2" \
            --build-arg "VCS_REF=${GITHUB_SHA}" \
            --tag healthcare-node-registry-app:security \
            --file docker/php/Dockerfile .
          docker build --pull \
            --target release-web \
            --build-arg "APP_VERSION=0.9.0-rc.2" \
            --build-arg "VCS_REF=${GITHUB_SHA}" \
            --tag healthcare-node-registry-web:security \
            --file docker/php/Dockerfile .
          docker build --pull \
            --build-arg "APP_VERSION=0.9.0-rc.2" \
            --build-arg "VCS_REF=${GITHUB_SHA}" \
            --tag healthcare-node-registry-postgres:security \
            --file docker/postgres/Dockerfile .
          docker pull clamav/clamav:1.5.4@sha256:638d90201ee7ee6a82d249a2fc23b132e578673b5f1f2766852b127676ca1ef6

      # Each scan reports independently so one finding cannot hide the
      # remaining images; the final gate step fails the job afterwards.
      - name: Scan application image
        id: scan-app
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          image-ref: healthcare-node-registry-app:security
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
          timeout: 15m

      - name: Scan web image
        id: scan-web
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          image-ref: healthcare-node-registry-web:security
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
          timeout: 15m

      - name: Scan database image
        id: scan-database
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          image-ref: healthcare-node-registry-postgres:security
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
          timeout: 15m

      - name: Scan malware-scanner image
        id: scan-malware-scanner
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          image-ref: clamav/clamav:1.5.4@sha256:638d90201ee7ee6a82d249a2fc23b132e578673b5f1f2766852b127676ca1ef6
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
          timeout: 15m

      - name: Generate application image SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: healthcare-node-registry-app:security
          format: cyclonedx-json
          output-file: healthcare-node-registry-app.cdx.json
          artifact-name: healthcare-node-registry-app-sbom
          syft-version: v1.51.0
          upload-artifact-retention: 30
          upload-release-assets: false

      - name: Generate web image SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: healthcare-node-registry-web:security
          format: cyclonedx-json
          output-file: healthcare-node-registry-web.cdx.json
          artifact-name: healthcare-node-registry-web-sbom
          syft-version: v1.51.0
          upload-artifact-retention: 30
          upload-release-assets: false

      - name: Generate database image SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: healthcare-node-registry-postgres:security
          format: cyclonedx-json
          output-file: healthcare-node-registry-postgres.cdx.json
          artifact-name: healthcare-node-registry-postgres-sbom
          syft-version: v1.51.0
          upload-artifact-retention: 30
          upload-release-assets: false

      - name: Generate malware-scanner image SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: clamav/clamav:1.5.4@sha256:638d90201ee7ee6a82d249a2fc23b132e578673b5f1f2766852b127676ca1ef6
          format: cyclonedx-json
          output-file: healthcare-node-registry-clamav.cdx.json
          artifact-name: healthcare-node-registry-clamav-sbom
          syft-version: v1.51.0
          upload-artifact-retention: 30
          upload-release-assets: false

      - name: Enforce container vulnerability gate
        if: always()
        shell: bash
        env:
          SCAN_APP: ${{ steps.scan-app.outcome }}
          SCAN_WEB: ${{ steps.scan-web.outcome }}
          SCAN_DATABASE: ${{ steps.scan-database.outcome }}
          SCAN_MALWARE_SCANNER: ${{ steps.scan-malware-scanner.outcome }}
        run: |
          set -euo pipefail

          failed=0
          {
            echo "| Image | Trivy outcome |"
            echo "|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          for result in \
            "application:${SCAN_APP}" \
            "web:${SCAN_WEB}" \
            "database:${SCAN_DATABASE}" \
            "malware-scanner:${SCAN_MALWARE_SCANNER}"; do
            image="${result%%:*}"
            outcome="${result#*:}"
            echo "| ${image} | ${outcome:-not run} |" >> "$GITHUB_STEP_SUMMARY"
            if [ "$outcome" != "success" ]; then
              echo "::error title=Container vulnerability gate::${image} image scan outcome: ${outcome:-not run}"
              failed=1
            fi
          done

          exit "$failed"
